services:
  postgres:
    image: postgres:16-alpine
    container_name: bioinfood-db
    environment:
      POSTGRES_USER: bioinfood
      POSTGRES_PASSWORD: bioinfood
      POSTGRES_DB: bioinfood_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
